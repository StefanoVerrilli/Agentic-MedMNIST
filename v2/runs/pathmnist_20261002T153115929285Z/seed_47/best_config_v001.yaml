{
  "data": {
    "augmentations": [
      "hflip",
      "brightness",
      "contrast"
    ],
    "batch_size": 128,
    "data_root": null,
    "download": true,
    "normalization": "standardize",
    "seed": 47,
    "test_limit": null,
    "train_limit": null,
    "val_limit": null
  },
  "model": {
    "adam_beta1": 0.9,
    "adam_beta2": 0.999,
    "channel_cap": 256,
    "class_weights": [
      1.04177987575531,
      1.0261131525039673,
      0.9418253302574158,
      0.938112735748291,
      1.218749761581421,
      0.8009613156318665,
      1.2372952699661255,
      1.0379012823104858,
      0.7572612166404724
    ],
    "cosine_eta_min": 0.0,
    "depth": 3,
    "dropout": 0.15,
    "hidden": 96,
    "label_smoothing": 0.05,
    "lr": 0.001,
    "mlp_ratio": 4,
    "model_family": "tiny_cnn",
    "momentum": 0.9,
    "nesterov": true,
    "num_heads": 4,
    "one_cycle_pct_start": 0.1,
    "optimizer": "adamw",
    "optimizer_eps": 1e-08,
    "patch_size": 4,
    "plateau_factor": 0.5,
    "plateau_patience": 1,
    "pooling": "cls",
    "positional_encoding": "learned",
    "scheduler": "cosine",
    "tokenizer_layers": 2,
    "weight_decay": 0.0001
  },
  "seed_everything": 47,
  "trainer": {
    "accelerator": "gpu",
    "callbacks": [
      {
        "class_path": "lightning.pytorch.callbacks.ModelCheckpoint",
        "init_args": {
          "auto_insert_metric_name": false,
          "enable_version_counter": false,
          "mode": "max",
          "monitor": "val_accuracy",
          "save_last": false,
          "save_top_k": 1
        }
      },
      {
        "class_path": "lightning.pytorch.callbacks.EarlyStopping",
        "init_args": {
          "check_finite": true,
          "min_delta": 0.0,
          "mode": "max",
          "monitor": "val_accuracy",
          "patience": 3
        }
      }
    ],
    "deterministic": true,
    "devices": 1,
    "enable_checkpointing": true,
    "enable_progress_bar": true,
    "gradient_clip_val": 1.0,
    "logger": false,
    "max_epochs": 15,
    "num_sanity_val_steps": 0
  }
}
